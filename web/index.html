<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhET Hardware Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="logo">PhET <span class="logo-sub">Simulator</span></div>
    
    <!-- Lab Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-lab="circuit">⚡ Circuit</button>
      <button class="tab-btn" data-lab="faraday">🧲 Faraday</button>
      <button class="tab-btn" data-lab="capacitor">⫛ Capacitor</button>
      <button class="tab-btn" data-lab="resistivity">📏 Resistor Wire</button>
      <button class="tab-btn" data-lab="photoelectric">💡 Photoelectric</button>
    </nav>

    <!-- INStep & Reset -->
    <div class="nav-controls">
      <button id="btn-run" class="btn active">▶ Run</button>
      <button id="btn-step" class="btn">⏭ Step</button>
      <button id="btn-reset" class="btn btn-red">↺ Reset</button>
    </div>
  </header>

  <!-- Main View -->
  <div class="main-layout">
    
    <!-- Left Toolbar (For Circuit) -->
    <aside class="sidebar-left" id="sidebar-left">
      <div class="side-title">COMPONENTS</div>
      <button class="tool-btn" data-type="battery">🔋 Battery</button>
      <button class="tool-btn" data-type="bulb">💡 Light Bulb</button>
      <button class="tool-btn" data-type="resistor">⚡ Resistor</button>
      <button class="tool-btn" data-type="switch">🔌 Switch</button>
      <button class="tool-btn" data-type="wire">〰️ Wire</button>
      <hr>
      <div class="side-title">PRESETS</div>
      <button class="preset-btn" data-preset="series">Series Circuit</button>
      <button class="preset-btn" data-preset="parallel">Parallel Circuit</button>
      <hr>
      <div class="side-title">ACTIONS</div>
      <button id="btn-clear" class="tool-btn" style="color: #ef4444; border-color: #fca5a5;">🗑️ Clear Canvas</button>
    </aside>

    <!-- Center Canvas Stage -->
    <main class="canvas-wrap" id="canvas-wrap">
      <canvas id="sim-canvas"></canvas>
      <div class="hud" id="hud">Current: 0.00 A | Time: 0.0 ms</div>

      <!-- PhET Component Tuner Bar -->
      <div class="tuner-bar" id="tuner-bar" style="display: none;">
        <div class="tuner-header">
          <span class="tuner-icon" id="tuner-icon">🔋</span>
          <span class="tuner-label" id="tuner-label">Battery</span>
          <span class="tuner-val-badge" id="tuner-val-badge">9.0 V</span>
        </div>
        <div class="tuner-controls" id="tuner-controls">
          <button id="tuner-btn-minus" class="tuner-small-btn" title="Decrease value">-</button>
          <input type="range" id="tuner-slider" min="0" max="120" step="1" value="9">
          <button id="tuner-btn-plus" class="tuner-small-btn" title="Increase value">+</button>
          <button id="tuner-btn-flip" class="tuner-action-btn" title="Reverse Polarity">⇄ Reverse</button>
          <button id="tuner-btn-toggle" class="tuner-action-btn" title="Toggle switch">Open / Close</button>
          <button id="tuner-btn-split" class="tuner-action-btn" title="Split junction">✂️ Split</button>
          <button id="tuner-btn-del" class="tuner-del-btn" title="Delete selected component">🗑️</button>
        </div>
      </div>
    </main>

    <!-- Right Controls Panel -->
    <aside class="sidebar-right" id="sidebar-right">
      <div class="side-title" id="ctrl-title">CONTROLS</div>

      <!-- Circuit Controls -->
      <div class="ctrl-group" id="group-circuit">
        <label>View Mode:</label>
        <select id="sel-view" class="input-select">
          <option value="real">Lifelike (2D)</option>
          <option value="schematic">Schematic</option>
        </select>
        <label style="margin-top: 10px;">Current Flow:</label>
        <select id="sel-flow" class="input-select">
          <option value="electrons">🔵 Electrons (e⁻)</option>
          <option value="conventional">🟠 Conventional (I)</option>
        </select>
      </div>

      <!-- Faraday Controls -->
      <div class="ctrl-group" id="group-faraday" style="display: none;">
        <label>Coil Loops (N): <span id="val-loops">3</span></label>
        <input type="range" id="rng-loops" min="1" max="4" value="3">
        <p class="hint">Drag the red/blue magnet through the copper coil!</p>
      </div>

      <!-- Capacitor Controls -->
      <div class="ctrl-group" id="group-capacitor" style="display: none;">
        <label>Plate Distance: <span id="val-cap-d">5 mm</span></label>
        <input type="range" id="rng-cap-d" min="2" max="10" value="5">
        <label style="margin-top: 10px;">Voltage: <span id="val-cap-v">1.5 V</span></label>
        <input type="range" id="rng-cap-v" min="0" max="3" step="0.5" value="1.5">
      </div>

      <!-- Resistivity Controls -->
      <div class="ctrl-group" id="group-resistivity" style="display: none;">
        <label>Wire Length: <span id="val-res-l">10 cm</span></label>
        <input type="range" id="rng-res-l" min="2" max="20" value="10">
        <label style="margin-top: 10px;">Thickness Area: <span id="val-res-a">5 mm²</span></label>
        <input type="range" id="rng-res-a" min="1" max="10" value="5">
      </div>

      <!-- Photoelectric Controls -->
      <div class="ctrl-group" id="group-photoelectric" style="display: none;">
        <label>Wavelength: <span id="val-pe-wave">400 nm</span></label>
        <input type="range" id="rng-pe-wave" min="200" max="800" value="400">
        <label style="margin-top: 10px;">Light Intensity: <span id="val-pe-int">60%</span></label>
        <input type="range" id="rng-pe-int" min="0" max="100" value="60">
      </div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
